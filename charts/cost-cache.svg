<text x="574.9" y="209.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">$0.00082</text>
<circle cx="452.4" cy="204" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<text x="440.4" y="209.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="end" font-weight="600">$0.00042</text>
<text x="314.0" y="273.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="end" font-weight="normal">Claude Haiku 4.5</text>
<circle cx="949.2" cy="268" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
<text x="937.2" y="273.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="end" font-weight="600">$0.00852</text>
<text x="961.2" y="273.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#475569" text-anchor="start" font-weight="normal">same: nothing was cached</text>
</svg>
